name: Build SciFortran binary releases

on:
  push:
    branches: [master-release]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: ubuntu-24.04-x86_64
          - runner: macos-15
            platform: macos-15-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install compiler and numerical libraries
        uses: ./.github/actions
        with:
          pack-type: open

      - name: Configure and build
        env:
          FC: mpif90
        run: |
          cmake -S . -B build-release -DBUILD_TYPE=RELEASE -DUSE_MPI=ON -DWITH_SCALAPACK=OFF
          cmake --build build-release --parallel 2

      - name: Package and verify installed layout
        env:
          FC: mpif90
          PLATFORM: ${{ matrix.platform }}
        run: |
          bash bin/package_release.sh build-release "$RUNNER_TEMP/packages" "$PLATFORM"
          bash bin/verify_release.sh "$RUNNER_TEMP/packages/scifor-${GITHUB_SHA}-${PLATFORM}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: scifor-${{ matrix.platform }}
          path: ${{ runner.temp }}/packages/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master-release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish prerelease for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tag="ci-${SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz --clobber
          else
            gh release create "$tag" dist/*.tar.gz \
              --target "$SHA" \
              --title "SciFortran CI ${SHA:0:12}" \
              --notes "Binary packages built from master-release at commit ${SHA}. See the package metadata for compiler and dependencies." \
              --prerelease --latest=false
          fi
